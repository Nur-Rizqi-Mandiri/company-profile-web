<section class="hero">
    <div class="hero-decoration blob-top-left"></div>
    <div class="hero-decoration blob-bottom-right"></div>

    <div class="hero-container">
        <div class="hero-text wow animate__animated animate__fadeInLeft">
            <h1 data-i18n="hero.title">Citarasa <span class="highlight">Istimewa</span></h1>
            <p data-i18n="hero.desc">Katering premium yang mengubah setiap acara menjadi momen tak terlupakan dengan
                hidangan lezat dan
                presentasi memukau.</p>
            <p style="margin-bottom: 1rem; font-weight: bold; color: var(--primary-color);" data-i18n="hero.cs">📞
                Layanan Pelanggan:
                (021)
                123-4567</p>
            <a href="#contact" class="hero-btn" data-i18n="hero.order">Pesan Sekarang</a>
        </div>

        <div class="hero-image-container wow animate__animated animate__zoomIn">
            <div class="special-offer-badge">
                <span data-i18n="hero.offer.label">Eksklusif</span>
                <div class="percent">20%</div>
                <span data-i18n="hero.offer.off">HEMAT</span>
            </div>
            <div class="hero-carousel">
                <div class="hero-slides">
                    <div class="hero-slide active">
                        <div class="main-image-frame">
                            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
                                alt="Hidangan Katering Segar">
                        </div>
                    </div>
                    <div class="hero-slide">
                        <div class="main-image-frame">
                            <img src="assets/img/hero/hero_carousel_1_premium_buffet.png" alt="Premium Buffet">
                        </div>
                    </div>
                    <div class="hero-slide">
                        <div class="main-image-frame">
                            <img src="assets/img/hero/hero_carousel_2_chef_plating.png" alt="Chef Plating">
                        </div>
                    </div>
                    <div class="hero-slide">
                        <div class="main-image-frame">
                            <img src="assets/img/hero/hero_carousel_3_corporate_lunch_box.png"
                                alt="Corporate Lunch Box">
                        </div>
                    </div>
                </div>
                <div class="carousel-dots">
                    <span class="dot active" onclick="setHeroSlide(0)"></span>
                    <span class="dot" onclick="setHeroSlide(1)"></span>
                    <span class="dot" onclick="setHeroSlide(2)"></span>
                    <span class="dot" onclick="setHeroSlide(3)"></span>
                </div>
            </div>
        </div>
    </div>
</section>
