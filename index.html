<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT. Nur Rizqi Mandiri | Katering Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header-container"></div>

    <div class="vertical-nav">
        <a href="#hero-container" class="nav-dot active" data-section="hero-container">
            <span class="nav-label" data-i18n="nav.home">Beranda</span>
        </a>
        <a href="#about-container" class="nav-dot" data-section="about-container">
            <span class="nav-label" data-i18n="nav.about">Tentang Kami</span>
        </a>
        <a href="#videos-container" class="nav-dot" data-section="videos-container">
            <span class="nav-label" data-i18n="nav.videos">Video</span>
        </a>
        <a href="#services-container" class="nav-dot" data-section="services-container">
            <span class="nav-label" data-i18n="nav.services">Layanan</span>
        </a>
        <a href="#menu-container" class="nav-dot" data-section="menu-container">
            <span class="nav-label" data-i18n="nav.menu">Menu</span>
        </a>
        <a href="#packages-container" class="nav-dot" data-section="packages-container">
            <span class="nav-label" data-i18n="nav.packages">Paket</span>
        </a>
        <a href="#gallery-container" class="nav-dot" data-section="gallery-container">
            <span class="nav-label" data-i18n="nav.gallery">Galeri</span>
        </a>
        <a href="#moments-container" class="nav-dot" data-section="moments-container">
            <span class="nav-label" data-i18n="nav.moments">Momen</span>
        </a>
        <a href="#faq-container" class="nav-dot" data-section="faq-container">
            <span class="nav-label" data-i18n="nav.faq">FAQ</span>
        </a>
        <a href="#trusted-container" class="nav-dot" data-section="trusted-container">
            <span class="nav-label" data-i18n="nav.trusted">Mitra</span>
        </a>
        <a href="#certifications-container" class="nav-dot" data-section="certifications-container">
            <span class="nav-label" data-i18n="nav.certifications">Sertifikasi</span>
        </a>
        <a href="#contact-container" class="nav-dot" data-section="contact-container">
            <span class="nav-label" data-i18n="nav.contact">Kontak</span>
        </a>
        <a href="#features-container" class="nav-dot" data-section="features-container">
            <span class="nav-label" data-i18n="nav.features">Keunggulan</span>
        </a>
        <a href="#stats-container" class="nav-dot" data-section="stats-container">
            <span class="nav-label" data-i18n="nav.stats">Statistik</span>
        </a>
        <a href="#testimonials-container" class="nav-dot" data-section="testimonials-container">
            <span class="nav-label" data-i18n="nav.testimonials">Testimoni</span>
        </a>
        <a href="#cta-container" class="nav-dot" data-section="cta-container">
            <span class="nav-label" data-i18n="nav.cta">Pesan</span>
        </a>

    </div>

    <div id="hero-container" class="snap-section"></div>
    <div id="about-container" class="snap-section"></div>
    <div id="videos-container" class="snap-section"></div>
    <div id="services-container" class="snap-section"></div>
    <div id="menu-container" class="snap-section"></div>
    <div id="packages-container" class="snap-section"></div>
    <div id="gallery-container" class="snap-section"></div>
    <div id="moments-container" class="snap-section"></div>
    <div id="faq-container" class="snap-section"></div>
    <div id="trusted-container" class="snap-section"></div>
    <div id="certifications-container" class="snap-section"></div>
    <div id="contact-container" class="snap-section"></div>
    <div id="features-container" class="snap-section"></div>
    <div id="stats-container" class="snap-section"></div>
    <div id="testimonials-container" class="snap-section"></div>
    <div id="cta-container" class="snap-section"></div>
    <div id="footer-container" class="snap-section"></div>
    <div id="floating-wa-container"></div>
    <div id="popup-promo-container"></div>
    <div id="popup-gallery-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>

    <script src="assets/js/translations.js"></script>
    <script>
        // Language state
        let currentLang = localStorage.getItem('lang') || 'id';

        // List of sections to load in order
        const sections = [
            { id: 'header-container', file: 'assets/page/header.html' },
            { id: 'hero-container', file: 'assets/page/hero.html' },
            { id: 'popup-promo-container', file: 'assets/page/popup-promo.html' },
            { id: 'about-container', file: 'assets/page/about.html' },
            { id: 'videos-container', file: 'assets/page/videos.html' },
            { id: 'services-container', file: 'assets/page/services.html' },
            { id: 'menu-container', file: 'assets/page/menu.html' },
            { id: 'packages-container', file: 'assets/page/packages.html' },
            { id: 'gallery-container', file: 'assets/page/gallery.html' },
            { id: 'moments-container', file: 'assets/page/moments.html' },
            { id: 'faq-container', file: 'assets/page/faq.html' },
            { id: 'trusted-container', file: 'assets/page/trusted.html' },
            { id: 'certifications-container', file: 'assets/page/certifications.html' },
            { id: 'contact-container', file: 'assets/page/contact.html' },
            { id: 'features-container', file: 'assets/page/features.html' },
            { id: 'stats-container', file: 'assets/page/stats.html' },
            { id: 'testimonials-container', file: 'assets/page/testimonials.html' },
            { id: 'cta-container', file: 'assets/page/cta.html' },
            { id: 'footer-container', file: 'assets/page/footer.html' },
            { id: 'floating-wa-container', file: 'assets/page/floating-wa.html' },
            { id: 'popup-gallery-container', file: 'assets/page/popup-gallery.html' }
        ];

        // Hero Carousel Logic
        let currentHeroSlide = 0;
        let heroInterval;

        window.setHeroSlide = function (index) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.dot');
            if (slides.length === 0) return;

            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));

            currentHeroSlide = index;
            if (currentHeroSlide >= slides.length) currentHeroSlide = 0;
            if (currentHeroSlide < 0) currentHeroSlide = slides.length - 1;

            if (slides[currentHeroSlide]) slides[currentHeroSlide].classList.add('active');
            if (dots[currentHeroSlide]) dots[currentHeroSlide].classList.add('active');

            // Reset interval on manual click
            clearInterval(heroInterval);
            startHeroAutoSlide();
        }

        function startHeroAutoSlide() {
            clearInterval(heroInterval);
            heroInterval = setInterval(() => {
                setHeroSlide(currentHeroSlide + 1);
            }, 5000);
        }

        // Function to load a single HTML file
        async function loadSection(id, file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`Failed to load ${file}`);
                const html = await response.text();
                document.getElementById(id).innerHTML = html;

                // Apply translations to the newly loaded section
                applyTranslations(document.getElementById(id));

                // Initialize carousel if hero is loaded
                if (id === 'hero-container') {
                    startHeroAutoSlide();
                }
            } catch (error) {
                console.error(error);
                document.getElementById(id).innerHTML = `<p>Error loading section: ${file}. Note: You must run this via a local server (e.g. Live Server).</p>`;
            }
        }

        // Translation Injection Logic
        function applyTranslations(container = document) {
            const elements = container.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang] && translations[currentLang][key]) {
                    const translation = translations[currentLang][key];

                    // Handle different element types
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translation;
                    } else if (el.tagName === 'SELECT') {
                        // For select, we might want to translate the first option if it's a placeholder
                        if (el.options[0] && el.options[0].getAttribute('data-i18n') === key) {
                            el.options[0].text = translation;
                        }
                    } else {
                        el.innerHTML = translation;
                    }
                }
            });

            // Update active state of language buttons
            const langButtons = document.querySelectorAll('.lang-btn');
            langButtons.forEach(btn => {
                const lang = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (lang === currentLang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Language Switcher Function
        window.switchLanguage = function (lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            applyTranslations();
        }

        // Initialize scripts after content is loaded
        function initScripts() {
            // Dynamic Year
            const yearElem = document.getElementById("copyright-year");
            if (yearElem) {
                const fullYear = new Date().getFullYear()
                yearElem.textContent = fullYear + '';
            }

            // Mobile Menu
            const menuToggle = document.getElementById("menuToggle");
            const navLinks = document.getElementById("navLinks");
            if (menuToggle && navLinks) {
                menuToggle.addEventListener("click", () => {
                    navLinks.classList.toggle("active");
                });
            }

            // Slider Logic
            if (document.getElementsByClassName("slide").length > 0) {
                window.slideIndex = 1;
                showSlides(window.slideIndex);
            }

            // Popup Logic Trigger (Configurable)
            setTimeout(() => {
                const configPopup = typeof ACTIVE_POPUP !== 'undefined' ? ACTIVE_POPUP : 'gallery'; // Default to gallery
                const hasSeenKey = `hasSeenPopup_${configPopup}`;
                const hasSeen = sessionStorage.getItem(hasSeenKey);

                if (!hasSeen) {
                    if (configPopup === 'promo' && typeof window.openPromoPopup === 'function') {
                        window.openPromoPopup();
                        sessionStorage.setItem(hasSeenKey, 'true');
                    } else if (configPopup === 'gallery' && typeof window.openGalleryPopup === 'function') {
                        window.openGalleryPopup();
                        sessionStorage.setItem(hasSeenKey, 'true');
                    }
                }
            }, 3000); // Show after 3 seconds
        }

        // Init WOW.js for animations
        new WOW().init();

        // Configurable Variable (Change this to 'gallery', 'promo', or 'none')
        const ACTIVE_POPUP = 'none';

        // Global functions
        window.openPromoPopup = function () {
            const popup = document.getElementById('promo-popup');
            if (popup) {
                popup.style.display = 'flex';
                // Trigger reflow
                popup.offsetHeight;
                popup.classList.add('show');
            }
        };

        window.closePopup = function () {
            const popup = document.getElementById('promo-popup');
            if (popup) {
                popup.classList.remove('show');
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 400); // Wait for transition
            }
        }

        // Gallery Popup Logic
        window.openGalleryPopup = function () {
            const popup = document.getElementById('gallery-popup');
            if (popup) {
                popup.style.display = 'flex';
                // Trigger reflow
                popup.offsetHeight;
                popup.classList.add('show');
            }
        };

        window.closeGalleryPopup = function () {
            const popup = document.getElementById('gallery-popup');
            if (popup) {
                popup.classList.remove('show');
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 400);
            }
        };

        let galleryIndex = 0;
        window.changeGallerySlide = function (n) {
            const showcase = document.querySelector('.gallery-showcase');
            if (!showcase) return;
            const images = showcase.querySelectorAll('img');

            images[galleryIndex].classList.remove('active');
            galleryIndex += n;

            if (galleryIndex >= images.length) galleryIndex = 0;
            if (galleryIndex < 0) galleryIndex = images.length - 1;

            images[galleryIndex].classList.add('active');

            // Optional: Update text based on slide index (can be expanded)
            const title = document.getElementById('gallery-title');
            const desc = document.getElementById('gallery-desc');

            const contentDataID = [
                { t: "Gala Amal Tahunan 2024", d: "Momen berbagi kebahagiaan bersama anak yatim dalam rangka ulang tahun perusahaan yang ke-14. Terima kasih kepada seluruh partner yang telah mendukung acara ini." },
                { t: "Grand Opening Cabang Baru", d: "Perluasan jangkauan layanan kami di Jakarta Selatan dengan konsep dapur terbuka." },
                { t: "Masterclass dengan Chef Rizqi", d: "Sesi sharing knowledge tentang kuliner nusantara kepada talenta muda berbakat." }
            ];

            const contentDataEN = [
                { t: "Annual Charity Gala 2024", d: "A moment of sharing happiness with orphans in celebration of the company's 14th anniversary. Thank you to all partners who supported this event." },
                { t: "New Branch Grand Opening", d: "Expanding our service reach in South Jakarta with an open kitchen concept." },
                { t: "Masterclass with Chef Rizqi", d: "Knowledge sharing session about Indonesian cuisine to talented young minds." }
            ];

            const contentData = currentLang === 'id' ? contentDataID : contentDataEN;

            if (title && desc && contentData[galleryIndex]) {
                title.innerText = contentData[galleryIndex].t;
                desc.innerText = contentData[galleryIndex].d;
            }
        };

        window.changeSlide = function (n) {
            showSlides(window.slideIndex += n);
        }

        window.showSlides = function (n) {
            let i;
            let slides = document.getElementsByClassName("slide");
            if (n > slides.length) {
                window.slideIndex = 1
            }
            if (n < 1) {
                window.slideIndex = slides.length
            }
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
                slides[i].classList.remove('active');
            }
            if (slides[window.slideIndex - 1]) {
                slides[window.slideIndex - 1].style.display = "block";
                slides[window.slideIndex - 1].classList.add('active');
            }
        }

        window.openTab = function (evt, tabName) {
            let i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Load all sections sequentially then init scripts
        async function loadAll() {
            // Ensure translations object exists
            if (typeof translations === 'undefined') {
                console.warn('Translations not loaded yet, retrying in 100ms...');
                setTimeout(loadAll, 100);
                return;
            }

            document.documentElement.lang = currentLang;
            for (const section of sections) {
                await loadSection(section.id, section.file);
            }
            initScripts();
            initVerticalNav();
        }


        function initVerticalNav() {
            const dots = document.querySelectorAll('.nav-dot');
            const sections = document.querySelectorAll('.snap-section');

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.5
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        dots.forEach(dot => {
                            if (dot.getAttribute('data-section') === id) {
                                dot.classList.add('active');
                            } else {
                                dot.classList.remove('active');
                            }
                        });
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        }

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>

</html>
